<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA — Fingerprint check</title>
<style>
  body { background:#0D0D0F; color:#F5F5F7; font-family: Roboto, Arial, sans-serif; margin:0; padding:16px; }
  h1 { font-size:18px; margin:4px 0 2px; }
  p.sub { color:#A2A2AD; font-size:13px; margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:8px 10px; border-bottom:1px solid #202027; vertical-align:top; text-align:left; }
  th { color:#A2A2AD; font-weight:normal; width:38%; }
  td { word-break:break-all; }
  .ok { color:#7BD88F; }
  .warn { color:#FF5A5F; }
  canvas { display:none; }
</style>
</head>
<body>
<h1>NEXORA fingerprint check</h1>
<p class="sub">What this page can see. Compare these values with the profile you opened — they should match the selected device, not your real phone.</p>
<table id="t"><tbody></tbody></table>
<canvas id="cv" width="280" height="60"></canvas>

<script>
(function () {
  var rows = [];
  function row(name, value) { rows.push([name, value]); }
  function safe(fn) { try { return fn(); } catch (e) { return 'error: ' + e.message; } }

  row('User-Agent', navigator.userAgent);
  row('navigator.platform', navigator.platform);
  row('hardwareConcurrency', String(navigator.hardwareConcurrency));
  row('deviceMemory (GB)', String(navigator.deviceMemory));
  row('language', navigator.language);
  row('languages', (navigator.languages || []).join(', '));
  row('maxTouchPoints', String(navigator.maxTouchPoints));
  row('webdriver', String(navigator.webdriver));
  row('screen.width x height', screen.width + ' x ' + screen.height);
  row('screen.availWidth x availHeight', screen.availWidth + ' x ' + screen.availHeight);
  row('colorDepth', String(screen.colorDepth));
  row('devicePixelRatio', String(window.devicePixelRatio));
  row('Intl timezone', safe(function () { return Intl.DateTimeFormat().resolvedOptions().timeZone; }));
  row('UTC offset (minutes)', String(new Date().getTimezoneOffset()));
  row('RTCPeerConnection', (typeof RTCPeerConnection === 'undefined') ? 'undefined (blocked)' : 'present');
  row('connection.effectiveType', safe(function () {
    return (navigator.connection && navigator.connection.effectiveType) || 'n/a';
  }));

  // WebGL — standard + unmasked values
  safe(function () {
    var gl = document.createElement('canvas').getContext('webgl') ||
             document.createElement('canvas').getContext('experimental-webgl');
    if (!gl) { row('WebGL', 'not available'); return; }
    row('WebGL VENDOR', gl.getParameter(gl.VENDOR));
    row('WebGL RENDERER', gl.getParameter(gl.RENDERER));
    var ext = gl.getExtension('WEBGL_debug_renderer_info');
    if (ext) {
      row('WebGL UNMASKED_VENDOR', gl.getParameter(ext.UNMASKED_VENDOR_WEBGL));
      row('WebGL UNMASKED_RENDERER', gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
    } else {
      row('WebGL debug extension', 'not exposed');
    }
  });

  // Canvas fingerprint hash (djb2 over the data URL)
  function hashString(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return ('0000000' + (h >>> 0).toString(16)).slice(-8);
  }
  safe(function () {
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '16px Arial';
    ctx.fillStyle = '#FF5A5F';
    ctx.fillRect(4, 4, 120, 24);
    ctx.fillStyle = '#F5F5F7';
    ctx.fillText('NEXORA fp test 123', 6, 8);
    ctx.beginPath();
    ctx.arc(220, 30, 18, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,160,255,0.7)';
    ctx.fill();
    row('Canvas hash', hashString(cv.toDataURL()));
  });

  function render() {
    var tb = document.querySelector('#t tbody');
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr><th>' + rows[i][0] + '</th><td>' + String(rows[i][1]).replace(/</g, '&lt;') + '</td></tr>';
    }
    tb.innerHTML = html;
  }
  render();

  // Audio fingerprint — needs OfflineAudioContext rendering (async)
  safe(function () {
    var Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Ctx) { row('Audio hash', 'OfflineAudioContext n/a'); render(); return; }
    var oc = new Ctx(1, 44100, 44100);
    var osc = oc.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    var comp = oc.createDynamicsCompressor();
    osc.connect(comp);
    comp.connect(oc.destination);
    osc.start(0);
    oc.startRendering().then(function (buffer) {
      var data = buffer.getChannelData(0);
      var sum = 0;
      for (var i = 4500; i < 5500; i++) { sum += Math.abs(data[i]); }
      row('AudioContext sampleRate', String(buffer.sampleRate));
      row('Audio hash (sum)', sum.toFixed(6));
      render();
    }).catch(function () {
      row('Audio hash', 'render failed');
      render();
    });
  });
})();
</script>
</body>
</html>
