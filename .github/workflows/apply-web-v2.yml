name: Apply web v2
on:
  push:
    branches: [main]
    paths: [nexora-web-v2.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply web v2 files
        run: |
          unzip -o nexora-web-v2.zip -d .
          rm -f nexora-web-v2.zip
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "Website v2: card and chip UX, desktop browsers, locales" || echo "nothing to commit"
          git push
