name: Apply markets
on:
  push:
    branches: [main]
    paths: [nexora-markets.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply markets files
        run: |
          unzip -o nexora-markets.zip -d .
          rm -f nexora-markets.zip
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "Country-wise official phone markets in database + site filter" || echo "nothing to commit"
          git push
