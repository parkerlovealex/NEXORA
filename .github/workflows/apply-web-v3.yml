name: Apply web v3
on:
  push:
    branches: [main]
    paths: [nexora-web-v3.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply web v3 files
        run: |
          unzip -o nexora-web-v3.zip -d .
          rm -f nexora-web-v3.zip
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "Website v3: auto dark/light theme from reference design" || echo "nothing to commit"
          git push
