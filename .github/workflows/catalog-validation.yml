name: Catalog Validation

on:
  push:
    paths:
      - "web/**"
      - "catalog/**"
      - "tools/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/catalog-validation.yml"
  pull_request:
    paths:
      - "web/**"
      - "catalog/**"
      - "tools/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/catalog-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Validate catalog manifest and schemas
        run: python tools/catalog_manifest.py check
      - name: Run UA template pipeline tests
        run: pytest -q tests/test_ua_templates_pipeline.py
