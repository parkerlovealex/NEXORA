name: Verify Android (Phase 4.2B)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Verify JSON dependency scope
        run: |
          gradle :app:dependencies --configuration debugUnitTestRuntimeClasspath --no-daemon > /tmp/test-deps.txt
          grep -q "android-json" /tmp/test-deps.txt && echo "android-json present on unit-test classpath"
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > /tmp/runtime-deps.txt
          if grep -q "android-json" /tmp/runtime-deps.txt; then echo "ERROR: android-json leaked into the production runtime classpath"; exit 1; fi
          echo "android-json absent from production runtime classpath"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk-42b
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
