name: Apply randomfix
on:
  push:
    branches: [main]
    paths: [nexora-randomfix.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply randomfix files
        run: |
          unzip -o nexora-randomfix.zip -d .
          rm -f nexora-randomfix.zip
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "Fix fixed-phone OS variation and keep device across country change" || echo "nothing to commit"
          git push
