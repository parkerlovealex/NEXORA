name: Alpha30 verification
on:
  push:
    branches: [verify/alpha30-checks]
permissions:
  contents: read

jobs:
  verify:
    name: Verify committed ${{ matrix.finding }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - finding: A16
            commit: 60123738025a212f4ec90a963f281f553969e766
          - finding: A18
            commit: 30c5bbb24a505f3dab9f270e79fc60d3cafe5298
          - finding: A20
            commit: 4dbd5df6a3c985d8adbb20e23b8adbccf53787ba
          - finding: A22
            commit: 259bf7a1878adf13b5e0207e290d2e20bf7110ac
          - finding: A36
            commit: e8f9a80954e9b35703831e2e91f8ecf33c710f5b
    env:
      VERIFY_FINDING: ${{ matrix.finding }}
      VERIFY_COMMIT: ${{ matrix.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: true
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt httpx
      - name: Resolve Maven Central dependencies through Google's public mirror
        shell: bash
        run: |
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cat > "$init_dir/alpha30-central.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repositories ->
                  repositories.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).configureEach { repo ->
                      if (repo.url.host in ['repo.maven.apache.org', 'repo1.maven.org']) {
                          repo.setUrl('https://maven-central.storage-download.googleapis.com/maven2/')
                      }
                  }
              }
          }
          GRADLE
      - name: Check Android SDK
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" || ! -d "$ANDROID_HOME/build-tools/34.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" < <(yes y)
          fi
      - name: Run full suites against exact committed tree
        run: python .github/alpha30_verification.py
      - name: Save suite output and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha30-committed-${{ matrix.finding }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nexora-alpha30-logs
          retention-days: 14
