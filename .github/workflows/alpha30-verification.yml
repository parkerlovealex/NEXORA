name: Inspect Alpha30 verification artifact
on:
  push:
    branches: [verify/alpha30-checks]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the original verification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alpha30-verification-46059445247.zip"
          gh api /repos/parkerlovealex/NEXORA/actions/artifacts/15227863499/zip > "$archive"
          python - "$archive" <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          archive = Path(sys.argv[1])
          expected = "b19068acedf043509729c286ef2173ae65d7cddbf60711ac6afdefde519e82e8"
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == expected, (digest, expected)
          print("ARCHIVE_SHA256 " + digest)
          with ZipFile(archive) as z:
              raw = z.read("summary.json")
              summary = json.loads(raw)
              assert summary["finding"] == "A16"
              assert summary["parent"] == "1f6ab8a8921eb6fdfa3eb8988d3eab54192200fe"
              print("ARCHIVED_SUMMARY_B64 " + base64.b64encode(raw).decode("ascii"))
              for filename in ("before.txt", "android.txt"):
                  print("GRADLE_LOG_BEGIN " + filename)
                  print("\n".join(z.read(filename).decode("utf-8", errors="replace").splitlines()[-210:]))
                  print("GRADLE_LOG_END " + filename)
              method = "explicitOsVersionConstrainsRandomBalancedSelectedAndCustomPools"
              results = {}
              for where in ("parent-junit", "candidate-junit"):
                  filename = where + "/TEST-com.nexora.browser.util.UserAgentGenerationEngineTest.xml"
                  if filename not in z.namelist():
                      results[where] = "no JUnit XML"
                      continue
                  cases = [c for c in ET.fromstring(z.read(filename)).findall("testcase") if c.get("name") == method]
                  assert len(cases) == 1, (filename, len(cases))
                  state = next((t for t in ("error", "failure", "skipped") if cases[0].find(t) is not None), "passed")
                  results[where] = state
              print("ARCHIVED_A16_TEST " + json.dumps(results))
          PY
