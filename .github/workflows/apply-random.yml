name: Apply random
on:
  push:
    branches: [main]
    paths: [nexora-random.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply random files
        run: |
          unzip -o nexora-random.zip -d .
          rm -f nexora-random.zip
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "Random device option for bulk generation, country pool first" || echo "nothing to commit"
          git push
