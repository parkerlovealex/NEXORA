name: Apply growth
on:
  push:
    branches: [main]
    paths: [nexora-growth.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply growth files
        run: |
          unzip -o nexora-growth.zip -d .
          rm -f nexora-growth.zip
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "Grow database to 44 devices, top-tier + all-country official coverage" || echo "nothing to commit"
          git push
