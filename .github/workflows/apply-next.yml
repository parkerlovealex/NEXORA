name: Apply next
on:
  push:
    branches: [main]
    paths: [nexora-next-upgrade.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply next files
        run: |
          unzip -o nexora-next-upgrade.zip -d .
          rm -f nexora-next-upgrade.zip
          git checkout -- .github/workflows/build.yml .github/workflows/refresh.yml || true
          git config user.name "nexora-update"
          git config user.email "update@nexora.local"
          git add -A
          git commit -m "NEXORA Next: dashboard platform, FastAPI backend, admin control center" || echo "nothing to commit"
          git push
